openapi: 3.0.3
info:
  title: MockSpin Sample API
  version: 1.0.0
  description: Dummy API for testing mockspin CLI and Prism-based mock backend

servers:
  - url: http://localhost:4010

tags:
  - name: Users
  - name: Orders

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-02-07T00:00:00Z"

  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"

    post:
      tags: [Users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /orders:
    get:
      tags: [Orders]
      summary: List orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

    post:
      tags: [Orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Conflict (duplicate order)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        name:
          type: string
          example: Rahul Sharma
        email:
          type: string
          format: email
          example: rahul@example.com
        role:
          type: string
          enum: [ADMIN, USER, SUPPORT]
          example: USER
        createdAt:
          type: string
          format: date-time
          example: "2026-02-07T00:00:00Z"

    UserCreate:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Rahul Sharma
        email:
          type: string
          format: email
          example: rahul@example.com
        role:
          type: string
          enum: [ADMIN, USER, SUPPORT]
          default: USER

    UserList:
      type: object
      required: [page, limit, total, data]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"

    Order:
      type: object
      required: [id, userId, amount, currency, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: "b8b6c1b6-1c9c-4c5f-8c8a-ec44f8db83c1"
        userId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        amount:
          type: number
          format: float
          example: 1499.99
        currency:
          type: string
          example: INR
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED]
          example: PENDING
        createdAt:
          type: string
          format: date-time
          example: "2026-02-07T00:00:00Z"

    OrderCreate:
      type: object
      required: [userId, amount]
      properties:
        userId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        amount:
          type: number
          format: float
          example: 1499.99
        currency:
          type: string
          default: INR

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: USER_NOT_FOUND
        message:
          type: string
          example: The requested user does not exist
        traceId:
          type: string
          example: 9f1c2a7e-acde-4f91-ae52-7e5d9c3b1b2a
